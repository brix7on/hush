name: release

on:
  push:
    tags: ["v*"]
    branches: [main, rust]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: |
          cargo test --release
          cargo build --target x86_64-pc-windows-gnu

      - name: Build
        run: |
          v=dev
          case "$GITHUB_REF" in refs/tags/v*) v="${GITHUB_REF_NAME#v}" ;; esac
          HUSH_VERSION="$v" cargo build --release --target x86_64-pc-windows-gnu
          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/hush.exe dist/hush.exe

      - name: Package
        run: |
          v="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) v="dev-${GITHUB_SHA::7}" ;; esac
          (cd dist && zip -9 "../hush-$v-windows-x64.zip" hush.exe)
          cp dist/hush.exe hush.exe
          sha256sum *.zip hush.exe > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            *.zip
            hush.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" ./*.zip hush.exe SHA256SUMS $pre \
            --title "hush ${GITHUB_REF_NAME#v}" \
            --notes "Скачайте \`hush.exe\` и запустите (или \`hush-…-windows-x64.zip\`, если браузер блокирует exe). Нужен бесплатный драйвер [VB-Cable](https://vb-audio.com/Cable/).
          Download and run \`hush.exe\` (or \`hush-…-windows-x64.zip\` if the browser blocks the exe). Requires the free [VB-Cable](https://vb-audio.com/Cable/) driver." \
            --generate-notes
