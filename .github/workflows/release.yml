name: release

on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          go test -race -short ./...

      - name: Build
        run: |
          v=dev
          case "$GITHUB_REF" in refs/tags/v*) v="${GITHUB_REF_NAME#v}" ;; esac
          if [ "$v" != dev ]; then
            go install github.com/tc-hib/go-winres@v0.3.3
            (cd cmd/hush && "$(go env GOPATH)/bin/go-winres" make --in winres/winres.json --arch amd64 \
              --product-version "$v.0" --file-version "$v.0")
          fi
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-H=windowsgui -s -w -X main.Version=$v" -o dist/hush.exe ./cmd/hush

      - name: Package
        run: |
          v="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) v="dev-${GITHUB_SHA::7}" ;; esac
          (cd dist && zip -9 "../hush-$v-windows-x64.zip" hush.exe)
          cp dist/hush.exe hush.exe
          sha256sum *.zip hush.exe > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            *.zip
            hush.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ./*.zip hush.exe SHA256SUMS \
            --title "hush ${GITHUB_REF_NAME#v}" \
            --notes "Скачайте \`hush.exe\` и запустите (или \`hush-…-windows-x64.zip\`, если браузер блокирует exe). Нужен бесплатный драйвер [VB-Cable](https://vb-audio.com/Cable/).
          Download and run \`hush.exe\` (or \`hush-…-windows-x64.zip\` if the browser blocks the exe). Requires the free [VB-Cable](https://vb-audio.com/Cable/) driver." \
            --generate-notes
